services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside Docker, reach the redis service by name instead of localhost.
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./pdfs:/app/pdfs
      - ./ingestion:/app/ingestion
      - ./qdrant_data:/app/qdrant_data
    restart: unless-stopped
    depends_on:
      - redis

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5500:5500"
    restart: unless-stopped
    depends_on:
      - backend

  # Cache for answers and query embeddings. Optional: without it the API falls
  # back to an in-process cache.
  redis:
    image: redis:7-alpine
    container_name: lexscope-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional local Qdrant. To use it, set QDRANT_URL=http://qdrant:6333 for the
  # backend (or http://localhost:6333 when running Python on the host) and
  # re-index with: python -m indexing.run_index
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: lexscope-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  redis-data:
  qdrant-data:
