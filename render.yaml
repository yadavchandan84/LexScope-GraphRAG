# Render Blueprint for the LexScope backend API (free plan).
# In Render: New > Blueprint > pick this repo.
#
# Fits the free plan (512 MB RAM, 0.1 CPU): models run on ONNX Runtime with no
# PyTorch, and the measured footprint is about 350-400 MB.
# The cross-encoder reranker is off by default here because 0.1 CPU makes it
# slow; set RERANKER_ENABLED=true on a paid plan for better ranking.
services:
  - type: web
    name: lexscope-api
    runtime: python
    plan: free
    # Models are downloaded at build time into models_cache/ so the service
    # doesn't download them every time it wakes up.
    buildCommand: pip install -r requirements.txt && python -m app.download_models
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.5"
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: EMBEDDING_DIM
        value: "384"
      - key: RERANKER_MODEL
        value: Xenova/ms-marco-MiniLM-L-6-v2
      - key: RERANKER_ENABLED
        value: "false"
      - key: ONNX_THREADS
        value: "1"
      - key: MODEL_CACHE_DIR
        value: models_cache
      - key: HF_HUB_DISABLE_TELEMETRY
        value: "1"
      - key: CACHE_ENABLED
        value: "true"
      # Redis connection string from the Key Value instance below.
      - key: REDIS_URL
        fromService:
          name: lexscope-redis
          type: keyvalue
          property: connectionString
      # --- Secrets: Render asks for these when you create the Blueprint ---
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_MODELS
        sync: false

  # Free Key Value (Redis-compatible) instance for the cache. Free instances
  # don't persist data, so the cache empties when it restarts.
  - type: keyvalue
    name: lexscope-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []           # only reachable from your Render services
